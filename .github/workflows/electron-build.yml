name: Electron build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - electron-wrap
      - electron-icon
      - electron-open-bible
      - pwa-icons
      - app-routing
      - electron-nav
    paths:
      - 'electron/**'
      - 'src/**'
      - 'public/**'
      - 'build-resources/**'
      - 'package.json'
      - 'yarn.lock'
      - 'scripts/electron-build.sh'
      - '.github/workflows/electron-build.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npm test -- --watchAll=false --passWithNoTests
      - run: npm run electron:build:win
        env:
          CI: "false"
          NODE_OPTIONS: --max-old-space-size=6144
          GENERATE_SOURCEMAP: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: rhapsody-bible-windows
          path: |
            dist/Rhapsody-Bible-Setup.exe
            dist/*.blockmap

  build-macos:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npm test -- --watchAll=false --passWithNoTests
      - run: npm run electron:build:mac
        env:
          CI: "false"
          NODE_OPTIONS: --max-old-space-size=6144
          GENERATE_SOURCEMAP: "false"
      - name: Rename macOS artifacts
        run: |
          mv dist/Rhapsody-Bible-arm64.dmg dist/Rhapsody-Bible-Apple-Silicon.dmg
          mv dist/Rhapsody-Bible-x64.dmg dist/Rhapsody-Bible-Intel.dmg
          test -f dist/Rhapsody-Bible-Apple-Silicon.dmg
          test -f dist/Rhapsody-Bible-Intel.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: rhapsody-bible-macos
          path: |
            dist/Rhapsody-Bible-Apple-Silicon.dmg
            dist/Rhapsody-Bible-Intel.dmg

  build-linux:
    runs-on: ubuntu-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npm test -- --watchAll=false --passWithNoTests
      - run: npm run electron:build:linux
        env:
          CI: "false"
          NODE_OPTIONS: --max-old-space-size=6144
          GENERATE_SOURCEMAP: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: rhapsody-bible-linux
          path: |
            dist/Rhapsody-Bible.AppImage
            dist/Rhapsody-Bible.deb

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rhapsody-bible-*
          merge-multiple: true
          path: release-assets
      - name: Verify release assets
        run: |
          ls -la release-assets/
          for f in Rhapsody-Bible-Setup.exe Rhapsody-Bible-Apple-Silicon.dmg Rhapsody-Bible-Intel.dmg Rhapsody-Bible.AppImage Rhapsody-Bible.deb; do
            test -f "release-assets/$f" || (echo "Missing $f" && exit 1)
          done
      - name: Upload to GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-build-${{ github.run_id }}
          name: Desktop build ${{ github.run_id }}
          draft: false
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-assets/Rhapsody-Bible-Setup.exe
            release-assets/Rhapsody-Bible-Apple-Silicon.dmg
            release-assets/Rhapsody-Bible-Intel.dmg
            release-assets/Rhapsody-Bible.AppImage
            release-assets/Rhapsody-Bible.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
